name: Code tests & eval

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  lint-vital:
    name: Lint vitals
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Foss,Gplay ]
        variant: [ Beta,Release ]
        module: [ app ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Check for fatal lint issues
        run: ./gradlew lintVital${{ matrix.flavor }}${{ matrix.variant }}

  build-modules:
    name: Build apps
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Foss,Gplay ]
        variant: [ Debug ]
        module: [ app ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Build modules
        run: ./gradlew ${{ matrix.module }}:assemble${{ matrix.flavor }}${{ matrix.variant }}

  test-modules:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        variant: [ Debug,Beta,Release ]
        flavor: [ test,testFoss,testGplay ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Test modules
        run: ./gradlew ${{ matrix.flavor }}${{ matrix.variant }}UnitTest

      - name: Print test failures summary
        if: failure()
        run: |
          echo ""
          echo "================================================================================"
          echo "❌ FAILED TESTS SUMMARY"
          echo "================================================================================"

          found_failures=false

          for xml in $(find . -path "*/build/test-results/*/*.xml" -type f 2>/dev/null); do
            # Extract module name from path
            module=$(echo "$xml" | sed 's|^\./||' | cut -d'/' -f1)

            # Parse failures from XML using grep and sed
            while IFS= read -r line; do
              if echo "$line" | grep -q 'testcase.*name='; then
                testname=$(echo "$line" | sed 's/.*name="\([^"]*\)".*/\1/')
                classname=$(echo "$line" | sed 's/.*classname="\([^"]*\)".*/\1/' | sed 's/.*\.//')
              fi
              if echo "$line" | grep -q '<failure'; then
                found_failures=true
                message=$(echo "$line" | sed 's/.*message="\([^"]*\)".*/\1/' | head -c 200)
                echo ""
                echo "📍 $module"
                echo "   $classname > $testname"
                echo "   $message"
              fi
            done < "$xml"
          done

          if [ "$found_failures" = false ]; then
            echo "Could not parse failure details from XML reports."
          fi

          echo ""
          echo "================================================================================"

      - name: Upload test results
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.flavor }}-${{ matrix.variant }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*
          retention-days: 1