name: Code tests & eval

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  lint-vital:
    name: Lint vitals
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Foss,Gplay ]
        variant: [ Beta,Release ]
        module: [ app ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Check for fatal lint issues
        run: ./gradlew lintVital${{ matrix.flavor }}${{ matrix.variant }}

  build-modules:
    name: Build apps
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Foss,Gplay ]
        variant: [ Debug ]
        module: [ app ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Build modules
        run: ./gradlew ${{ matrix.module }}:assemble${{ matrix.flavor }}${{ matrix.variant }}

  test-modules:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        variant: [ Debug,Beta,Release ]
        flavor: [ test,testFoss,testGplay ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Test modules
        run: ./gradlew ${{ matrix.flavor }}${{ matrix.variant }}UnitTest

      - name: Print test failures summary
        if: failure()
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import html
          import glob

          print()
          print("=" * 80)
          print("❌ FAILED TESTS SUMMARY")
          print("=" * 80)

          found = False
          for xml_file in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  tree = ET.parse(xml_file)
                  for testcase in tree.findall(".//testcase"):
                      failure = testcase.find("failure")
                      if failure is not None:
                          found = True
                          module = xml_file.split("/")[0]
                          classname = testcase.get("classname", "").split(".")[-1]
                          testname = testcase.get("name", "unknown")
                          message = failure.get("message", "")[:200]
                          message = html.unescape(message)
                          print()
                          print(f"📍 {module}")
                          print(f"   {classname} > {testname}")
                          print(f"   {message}")
              except ET.ParseError:
                  pass

          if not found:
              print("No failure details found in XML reports.")

          print()
          print("=" * 80)
          EOF

      - name: Upload test results
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.flavor }}-${{ matrix.variant }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*
          retention-days: 1