name: Code tests & eval

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-vital:
    name: Lint vitals
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Foss,Gplay ]
        variant: [ Beta,Release ]
        module: [ app ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Check for fatal lint issues
        run: ./gradlew lintVital${{ matrix.flavor }}${{ matrix.variant }}

  build-modules:
    name: Build apps
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Foss,Gplay ]
        variant: [ Debug ]
        module: [ app ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Build modules
        run: ./gradlew ${{ matrix.module }}:assemble${{ matrix.flavor }}${{ matrix.variant }}

      - name: Build and test SAF test provider
        if: matrix.flavor == 'Foss'
        run: ./gradlew :saf-test-provider:assembleDebug :saf-test-provider:testDebugUnitTest

  test-modules:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        variant: [ Debug ]
        # These two flavors cover modules carrying the `version` dimension.
        # The unflavored SAF test fixture is excluded on purpose and covered by
        # the explicit build and test step in build-modules instead.
        flavor: [ testFoss,testGplay ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Test modules
        run: ./gradlew ${{ matrix.flavor }}${{ matrix.variant }}UnitTest

      - name: Verify Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- '*/schemas/*')" ]; then
            git status --porcelain -- '*/schemas/*'
            echo "::error::Room schema changed without being committed. Bump the @Database version, commit the new schema JSON, and add a Migration to the database's MIGRATIONS list."
            exit 1
          fi

      - name: Print test failures summary
        if: failure()
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import html
          import glob

          print()
          print("=" * 80)
          print("❌ FAILED TESTS SUMMARY")
          print("=" * 80)

          found = False
          suspect_suites = []
          for xml_file in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  tree = ET.parse(xml_file)
              except ET.ParseError:
                  continue

              module = xml_file.split("/")[0]

              for testcase in tree.findall(".//testcase"):
                  # <failure> = assertion failed, <error> = test blew up (exception, init failure)
                  for kind, element in (("FAILURE", testcase.find("failure")), ("ERROR", testcase.find("error"))):
                      if element is None:
                          continue
                      found = True
                      classname = testcase.get("classname", "").split(".")[-1]
                      testname = testcase.get("name", "unknown")
                      message = html.unescape(element.get("message", "")[:200])
                      print()
                      print(f"📍 {module} [{kind}]")
                      print(f"   {classname} > {testname}")
                      print(f"   {message}")

              for suite in tree.iter("testsuite"):
                  def count(attr):
                      try:
                          return int(suite.get(attr, "0"))
                      except ValueError:
                          return 0

                  failures, errors, skipped = count("failures"), count("errors"), count("skipped")
                  if errors or skipped:
                      print()
                      print(f"📊 {module} {suite.get('name', '?')}: "
                            f"tests={count('tests')} failures={failures} errors={errors} skipped={skipped}")
                  # Worker-death fingerprint: nothing failed, yet tests were skipped/errored out.
                  if failures == 0 and skipped > 0:
                      suspect_suites.append(f"{module} {suite.get('name', '?')} ({skipped} skipped)")

          if not found:
              print("No <failure>/<error> details found in XML reports.")
              print("If the Gradle output above mentions a worker 'finished with non-zero exit value'")
              print("or 'unexpected problem', the test JVM died - see the raw Gradle output and the")
              print("uploaded test-jvm-crash artifact (hs_err / heap dumps).")

          if suspect_suites and not found:
              print()
              print("⚠️  POSSIBLE TEST JVM WORKER DEATH - suites with skipped tests but zero failures:")
              for entry in suspect_suites:
                  print(f"   {entry}")
              print("   (legitimate assumption-based skips look the same, so cross-check the Gradle output)")

          print()
          print("=" * 80)
          EOF

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.flavor }}-${{ matrix.variant }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*
          retention-days: 1

      - name: Upload test JVM crash diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: failure()
        with:
          name: test-jvm-crash-${{ matrix.flavor }}-${{ matrix.variant }}
          path: |
            **/build/test-jvm-crash/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: ignore
          retention-days: 7

  smb-integration:
    name: SMB integration (Docker)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false
      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Verify Docker is available
        run: docker info

      # Testcontainers boots the digest-pinned Samba images with isolated ports and shares.
      - name: Run SMBJ and Kotlin contracts with coverage
        run: ./gradlew :lib-smb:koverXmlReport :lib-smb:koverHtmlReport

      - name: Exercise the app gateway against Samba
        run: ./gradlew :app-common-io:testFossDebugUnitTest --tests '*SmbGatewayIntegrationTest' --rerun --no-build-cache

      - name: Require executed integration suites and summarize coverage
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          suites = {
              "Wire unit tests": Path("lib-smb/build/test-results/test/TEST-eu.darken.smb.WireTest.xml"),
              "Crypto unit tests": Path("lib-smb/build/test-results/test/TEST-eu.darken.smb.CryptoTest.xml"),
              "NTLM unit tests": Path("lib-smb/build/test-results/test/TEST-eu.darken.smb.NtlmTest.xml"),
              "Cancellation unit tests": Path("lib-smb/build/test-results/test/TEST-eu.darken.smb.CancellationTest.xml"),
              "SMBJ wire reference": Path("lib-smb/build/test-results/test/TEST-eu.darken.smb.SmbjWireContractTest.xml"),
              "SMBJ reference": Path("lib-smb/build/test-results/contractTest/TEST-eu.darken.smb.SmbjContractTest.xml"),
              "Kotlin implementation": Path("lib-smb/build/test-results/contractTest/TEST-eu.darken.smb.KotlinSmbContractTest.xml"),
              "Security and transport": Path("lib-smb/build/test-results/contractTest/TEST-eu.darken.smb.ProtocolSecurityTest.xml"),
              "App gateway": Path("app-common-io/build/test-results/testFossDebugUnitTest/TEST-eu.darken.butler.common.files.smb.SmbGatewayIntegrationTest.xml"),
          }
          summary = ["## SMB Docker integration", "", "| Suite | Passed |", "| --- | ---: |"]
          for label, path in suites.items():
              result = ET.parse(path).getroot()
              count = int(result.attrib["tests"])
              if count == 0 or any(int(result.attrib[key]) for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"{label} did not run successfully without skips: {result.attrib}")
              summary.append(f"| {label} | {count} |")

          report = ET.parse("lib-smb/build/reports/kover/report.xml").getroot()
          classes = {item.attrib["name"]: item for item in report.findall(".//class")}
          for name in ("Connection", "NativeShare", "Ntlm"):
              item = classes[f"eu/darken/smb/protocol/{name}"]
              lines = item.find("counter[@type='LINE']")
              if lines is None or int(lines.attrib["covered"]) == 0:
                  raise SystemExit(f"Missing protocol coverage for {name}")
          counters = {counter.attrib["type"]: counter for counter in report.findall("counter")}
          summary += ["", "Coverage of lib-smb production code from unit and Docker tests:"]
          for kind in ("LINE", "BRANCH"):
              counter = counters[kind]
              covered = int(counter.attrib["covered"])
              total = covered + int(counter.attrib["missed"])
              if total == 0:
                  raise SystemExit(f"Missing {kind} coverage")
              summary.append(f"- {kind.title()}: {covered}/{total} ({covered / total:.1%})")
          summary += ["", "Samba interoperability; no Android UI, Windows, or macOS coverage."]
          text = "\n".join(summary) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(text)
          PY

      - name: Upload SMB test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: smb-integration-reports
          path: |
            lib-smb/build/test-results/**/*.xml
            lib-smb/build/reports/tests/**
            lib-smb/build/reports/kover/**
            app-common-io/build/test-results/testFossDebugUnitTest/**/*.xml
            app-common-io/build/reports/tests/testFossDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14

  check-release-tooling:
    name: Release tooling
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false
      - name: Install bats and shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y bats shellcheck
      - name: Shellcheck bump.sh
        run: shellcheck tools/release/bump.sh
      - name: Run bump.sh unit tests
        run: bats tools/release/bump.bats
      - name: Live consistency check
        run: bash tools/release/bump.sh --mode=check
