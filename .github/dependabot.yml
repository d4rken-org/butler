version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
          - "androidx.hilt*"
      dagger:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
